version: 1
runtime:
  provider: codex-sdk
  executor_command: "python3 scripts/adapters/codex_sdk_executor.py"
  fallback_provider: codex-cli
  fallback_executor_command: "python3 scripts/adapters/codex_cli_executor.py"
  transport: local_subscription
  api_required: false
  model_router: false
  default_execution_profile: balanced
  execution_profiles:
    complex:
      model: gpt-5.6-sol
      reasoning_effort: high
      service_tier: fast
    balanced:
      model: gpt-5.6-terra
      reasoning_effort: medium
      service_tier: fast
    economy:
      model: gpt-5.6-luna
      reasoning_effort: low
      service_tier: fast
  require_account_type: chatgpt
