[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness"
version = "0.2.0"
description = "Policy-governed local engineering harness with a provider-neutral runtime"
readme = "docs/index.md"
requires-python = ">=3.11"
dependencies = [
  "openai-codex==0.144.4",
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "PyYAML>=6.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
agent = "ai_harness.cli:main"

[tool.setuptools.packages.find]
include = ["ai_harness*"]

[tool.setuptools.data-files]
"share/ai-harness" = [
  ".agent-artifact-owners.yaml",
  ".agent-policy.yaml",
  ".agent-project-profiles.yaml",
  ".agent-role-policy.yaml",
  ".agent-recovery.yaml",
  ".agent-role-capabilities.yaml",
  ".agent-role-contracts.yaml",
  ".agent-routing.yaml",
  ".agent-runtime.yaml",
  ".agent-tool-policy.yaml",
  ".agent-workflows.yaml",
  "AGENTS.md",
  "install.sh",
  "Makefile",
  "packaging/.agent-repositories.yaml",
]
"share/ai-harness/scripts" = ["scripts/*.py"]
"share/ai-harness/scripts/adapters" = ["scripts/adapters/*.py"]
"share/ai-harness/scripts/runtimes" = ["scripts/runtimes/*.py"]
"share/ai-harness/schemas" = ["schemas/*.json"]
"share/ai-harness/schemas/roles" = ["schemas/roles/*.json"]
"share/ai-harness/.agents/prompts" = [".agents/prompts/*.md"]
"share/ai-harness/.agents/skills/context-engineering" = [".agents/skills/context-engineering/SKILL.md"]
"share/ai-harness/.agents/skills/django-standards" = [".agents/skills/django-standards/SKILL.md"]
"share/ai-harness/.agents/skills/documentation-and-adrs" = [".agents/skills/documentation-and-adrs/SKILL.md"]
"share/ai-harness/.agents/skills/drf-standards" = [".agents/skills/drf-standards/SKILL.md"]
"share/ai-harness/.agents/skills/git-workflow" = [".agents/skills/git-workflow/SKILL.md"]
"share/ai-harness/.agents/skills/issue-intake" = [".agents/skills/issue-intake/SKILL.md"]
"share/ai-harness/.agents/skills/lessons-writer" = [".agents/skills/lessons-writer/SKILL.md"]
"share/ai-harness/.agents/skills/performance-optimization" = [".agents/skills/performance-optimization/SKILL.md"]
"share/ai-harness/.agents/skills/python-standards" = [".agents/skills/python-standards/SKILL.md"]
"share/ai-harness/.agents/skills/release-safety" = [".agents/skills/release-safety/SKILL.md"]
"share/ai-harness/.agents/skills/repo-policy" = [".agents/skills/repo-policy/SKILL.md"]
"share/ai-harness/.agents/skills/security-checklist" = [".agents/skills/security-checklist/SKILL.md"]
"share/ai-harness/.agents/skills/structured-output-guard" = [".agents/skills/structured-output-guard/SKILL.md"]
"share/ai-harness/.agents/skills/test-writing" = [".agents/skills/test-writing/SKILL.md"]
"share/ai-harness/docs/templates" = ["docs/templates/goal.md"]
"share/ai-harness/evals" = ["evals/README.md", "evals/adaptive_execution_acceptance.json"]
"share/ai-harness/evals/datasets" = ["evals/datasets/*.json"]
"share/ai-harness/evals/datasets/adaptive_execution" = ["evals/datasets/adaptive_execution/*.json"]
"share/ai-harness/evals/benchmarks" = ["evals/benchmarks/*.json"]
"share/ai-harness/evals/golden_tasks" = ["evals/golden_tasks/*.json"]
"share/ai-harness/evals/regressions" = ["evals/regressions/*.json"]
"share/ai-harness/evals/rubrics" = ["evals/rubrics/*.json"]
"share/ai-harness/evals/baselines" = ["evals/baselines/*.json"]
"share/ai-harness/evals/experiments" = ["evals/experiments/*.json"]
